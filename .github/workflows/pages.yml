# GitHub Pages — deploy only when the landing page changes.
#
# Repo Settings → Pages → Build and deployment → Source: GitHub Actions
# (disables the automatic "pages-build-deployment" run on every main push)

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/index.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site/assets
          cp docs/index.html site/
          if [ -d assets ]; then
            cp -r assets/. site/assets/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

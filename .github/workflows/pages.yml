# GitHub Pages — manual release only (workflow_dispatch).
#
# Requires repo Settings → Pages → Build and deployment → Source: GitHub Actions.
# If Source is "Deploy from a branch" (legacy /docs on main), GitHub runs
# pages-build-deployment on every push to main — independent of this file.

name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site/assets
          cp docs/index.html site/
          if [ -d assets ]; then
            cp -r assets/. site/assets/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

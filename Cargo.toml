[package]
name = "profile"
version = "2.1.3"
edition = "2021"
authors = ["Gagandeep Singh <jungledesh@gmail.com>"]
description = "A closed loop, physics-grounded, cost-aware optimizer for vLLM."
license = "Apache-2.0"
repository = "https://github.com/jungledesh/profile"

[[bin]]
name = "profile"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
nvml-wrapper = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
prometheus-parse = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1 
strip = true


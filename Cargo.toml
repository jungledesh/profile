[package]
name = "profile"
version = "2.2.2"
edition = "2024"
authors = ["Gagandeep Singh <jungledesh@gmail.com>"]
description = "A closed loop, physics-grounded, cost-aware optimizer for vLLM."
license = "Apache-2.0"
repository = "https://github.com/jungledesh/profile"

[features]
default = ["nvidia", "amd"]
nvidia = ["dep:nvml-wrapper"]
# Enables libamdgpu_top off Windows (target dep below). Windows release builds
# stay nvidia-only: libdrm uses std::os::fd, which MSVC does not have.
amd = ["dep:libamdgpu_top"]

[[bin]]
name = "profile"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
clap_complete = { version = "4.5", default-features = false }
clap_mangen = "0.2"
anyhow = "1.0.103"
nvml-wrapper = { version = "0.12", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
prometheus-parse = "0.2"

# libdrm/amdgpu: not Windows. Must not appear in the Windows dependency graph or
# cargo-dist's x86_64-pc-windows-msvc job fails compiling std::os::fd. macOS can
# compile the crate (Unix fd exists); runtime AMD telemetry still needs Linux DRM.
[target.'cfg(not(target_os = "windows"))'.dependencies]
libamdgpu_top = { version = "=0.11.5", optional = true, default-features = false, features = ["libdrm_dynamic_loading"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
